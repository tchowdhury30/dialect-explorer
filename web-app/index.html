<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sook Sout — Arabic phrasebook for travellers</title>
    <meta
      name="description"
      content="Learn everyday Egyptian and Levantine Arabic from native speakers. Real recordings, real dialect, built for travellers."
    />
    <meta name="theme-color" content="#f9f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />


    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sook Sout" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve theme + dialect before first paint so there is no flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('appSettings') || '{}');
          var d = s.currentDialect === 'Levantine' ? 'levantine' : 'egyptian';
          document.documentElement.setAttribute('data-dialect', d);
          var t = s.theme || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.setAttribute('data-dialect', 'egyptian');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
