<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sook Sout — Arabic phrasebook for travellers</title>
    <meta
      name="description"
      content="Learn everyday Egyptian and Jordanian Arabic from native speakers. Real recordings, real dialect, built for travellers."
    />
    <meta name="theme-color" content="#fff6e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1a2c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />


    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sook Sout" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects this at deploy; the app submits to it with fetch
         (components/Contact.tsx). Never shown. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="kind" />
      <textarea name="message"></textarea>
      <input name="contact" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
